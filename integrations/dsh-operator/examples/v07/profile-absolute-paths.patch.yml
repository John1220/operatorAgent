# Apply after installing the tgz into your own isolated DSH profile.
# Replace BOTH commands with absolute paths from the clean Python 3.12 venv.
# DSH replaces each entry's entire config with this override.
- id: mcp-operator
  config:
    serverName: operator
    transport: stdio
    command: /absolute/path/to/v07-venv/bin/operator-agent-mcp
    toolCallTimeoutMs: 3600000
    failOnStartupError: true
- id: operator-tools
  config:
    command: /absolute/path/to/v07-venv/bin/operator-agent
    timeoutMs: 60000
