# Apply after installing the candidate tgz into your own isolated DSH profile.
# Replace BOTH commands with absolute paths from the clean Python 3.12 venv.
# This is an override of the bundle's two existing records, not a second insert.
- id: mcp-operator
  config:
    command: /absolute/path/to/v07-venv/bin/operator-agent-mcp
    failOnStartupError: true
- id: operator-tools
  config:
    command: /absolute/path/to/v07-venv/bin/operator-agent
